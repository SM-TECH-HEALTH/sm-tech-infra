name: Postgres Schedule

# Liga o Postgres em dias uteis as 08:00 BRT (11:00 UTC) e desliga
# todo dia as 20:00 BRT (23:00 UTC). Aos fins de semana o servidor
# fica desligado o dia inteiro.
#
# Custo do Postgres B1ms quando STOPPED: apenas storage (~R$ 16/mes).
# Custo do Postgres B1ms quando RUNNING: ~R$ 95-100/mes, mas pago apenas
# pelas horas em que ele estiver ligado. Esse workflow ajusta isso para
# cerca de 12h x 5d/semana = ~60 horas uteis por semana = ~R$ 20-25/mes.

on:
  schedule:
    # 23:00 UTC todo dia (20:00 BRT) -> stop
    - cron: '0 23 * * *'
    # 11:00 UTC dias uteis (08:00 BRT) -> start
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Acao a executar'
        required: true
        type: choice
        options:
          - start
          - stop
        default: 'stop'

permissions:
  contents: read
  id-token: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    environment: development
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: dev
    steps:
      - name: Azure login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Decidir acao
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "do=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
            echo "do=start" >> "$GITHUB_OUTPUT"
          else
            echo "do=stop" >> "$GITHUB_OUTPUT"
          fi

      - name: Localizar Postgres do ambiente
        id: pg
        run: |
          # Procura o flexible-server com tag azd-env-name = dev
          set -e
          SERVER_JSON=$(az postgres flexible-server list --query "[?tags.\"azd-env-name\" == '${AZURE_ENV_NAME}'] | [0]" -o json)
          if [ -z "$SERVER_JSON" ] || [ "$SERVER_JSON" = "null" ]; then
            echo "Nenhum Postgres encontrado com tag azd-env-name=${AZURE_ENV_NAME}. Saindo sem erro."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SERVER_NAME=$(echo "$SERVER_JSON" | jq -r .name)
          RG=$(echo "$SERVER_JSON" | jq -r .resourceGroup)
          STATE=$(echo "$SERVER_JSON" | jq -r .state)
          echo "Server: $SERVER_NAME / RG: $RG / State: $STATE"
          echo "found=true"        >> "$GITHUB_OUTPUT"
          echo "name=$SERVER_NAME" >> "$GITHUB_OUTPUT"
          echo "rg=$RG"            >> "$GITHUB_OUTPUT"
          echo "state=$STATE"      >> "$GITHUB_OUTPUT"

      - name: Start Postgres
        if: steps.pg.outputs.found == 'true' && steps.action.outputs.do == 'start' && steps.pg.outputs.state != 'Ready'
        run: az postgres flexible-server start --name "${{ steps.pg.outputs.name }}" --resource-group "${{ steps.pg.outputs.rg }}"

      - name: Stop Postgres
        if: steps.pg.outputs.found == 'true' && steps.action.outputs.do == 'stop' && steps.pg.outputs.state == 'Ready'
        run: az postgres flexible-server stop --name "${{ steps.pg.outputs.name }}" --resource-group "${{ steps.pg.outputs.rg }}"

      - name: Sem acao necessaria
        if: steps.pg.outputs.found == 'true' && ((steps.action.outputs.do == 'start' && steps.pg.outputs.state == 'Ready') || (steps.action.outputs.do == 'stop' && steps.pg.outputs.state != 'Ready'))
        run: echo "Postgres ja esta no estado desejado (acao=${{ steps.action.outputs.do }} / state=${{ steps.pg.outputs.state }})."
