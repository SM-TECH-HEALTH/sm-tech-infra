# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: sm-tech
metadata:
  template: sm-tech@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

pipeline:
  provider: github

# A API nao usa `azd deploy` porque trocamos o ACR pelo GHCR (gratis).
# O workflow do sm-tech-back faz `docker build && docker push ghcr.io/...`
# e depois `az containerapp update --image ...`.
# Front e site institucional usam SWA CLI no GitHub Actions (workaround azd deploy).
services:
  web:
    project: ../sm-tech-front
    language: js
    host: staticwebapp
    dist: dist/sm-tech-front/browser
  site:
    project: ../site-institucional
    language: js
    host: staticwebapp
    dist: dist
