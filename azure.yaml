# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: sm-tech
metadata:
  template: sm-tech@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

pipeline:
  provider: github

services:
  api:
    project: ../sm-tech-back
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: .
  web:
    project: ../sm-tech-front
    language: js
    host: staticwebapp
    dist: dist/sm-tech-front/browser
