# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: sm-tech
metadata:
  template: sm-tech@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

pipeline:
  provider: github

# A API e os agentes nao usam `azd deploy` porque o registro e o GHCR (gratis).
# Workflows: sm-tech-back (tag azd-service-name=api) e sm-tech-agents (tag agents).
# Front e site institucional usam SWA CLI no GitHub Actions (workaround azd deploy).
# Azure OpenAI + Container App agents nascem quando DEPLOY_AI_AGENTS=true (workflow agents).
services:
  web:
    project: ../sm-tech-front
    language: js
    host: staticwebapp
    dist: dist/sm-tech-front/browser
  site:
    project: ../site-institucional
    language: js
    host: staticwebapp
    dist: dist
